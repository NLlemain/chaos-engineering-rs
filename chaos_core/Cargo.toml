[package]
name = "chaos_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Cross-platform fault injectors and recovery primitives for chaos experiments"
keywords = ["chaos-engineering", "resilience", "fault-injection", "testing"]
categories = ["development-tools::testing", "asynchronous", "network-programming"]

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
pnet = { workspace = true }
socket2 = { workspace = true }
futures = { workspace = true }
sysinfo = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1.6", features = ["v4", "serde"] }
num_cpus = "1.16"
reqwest = { version = "0.11", features = ["json"] }
axum = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
fs2 = "0.4"

[dev-dependencies]
mockall = { workspace = true }
tokio-test = "0.4"
