[package]
name = "chaos_targets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Disposable target services used by chaos-engineering-rs integration tests"
publish = false

[[bin]]
name = "axum_http_service"
path = "src/bin/axum_http_service.rs"

[[bin]]
name = "websocket_feed"
path = "src/bin/websocket_feed.rs"

[[bin]]
name = "tcp_echo_server"
path = "src/bin/tcp_echo_server.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
futures = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
