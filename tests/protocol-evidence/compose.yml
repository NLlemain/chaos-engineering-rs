services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: chaos
      POSTGRES_DB: evidence
    healthcheck:
      test: [CMD-SHELL, pg_isready -U chaos -d evidence]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-client:
    image: postgres:16-alpine
    profiles: [postgres]
    entrypoint: [/bin/sh, -c]
    command: sleep 3600
    environment:
      PGPASSWORD: chaos
    depends_on:
      postgres:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: chaos-root
      MYSQL_USER: chaos
      MYSQL_PASSWORD: chaos
      MYSQL_DATABASE: evidence
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uchaos, -pchaos, --silent]
      interval: 3s
      timeout: 3s
      retries: 40

  mysql-client:
    image: mysql:8.4
    profiles: [mysql]
    entrypoint: [/bin/sh, -c]
    command: sleep 3600
    depends_on:
      mysql:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 3s
      timeout: 5s
      retries: 40

  kafka-client:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    entrypoint: [/bin/sh, -c]
    command: sleep 3600
    depends_on:
      kafka:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: chaos
      RABBITMQ_DEFAULT_PASS: chaos
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 3s
      retries: 40

  rabbitmq-client:
    image: alpine:3.20
    profiles: [rabbitmq]
    command: sleep 3600
    depends_on:
      rabbitmq:
        condition: service_healthy

  nats:
    image: nats:2.11-alpine
    profiles: [nats]

  nats-client:
    image: natsio/nats-box:0.17.0
    profiles: [nats]
    entrypoint: [/bin/sh, -c]
    command: sleep 3600
    depends_on: [nats]

  mqtt:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - ./mosquitto.conf:/mosquitto-no-auth.conf:ro

  mqtt-client:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    entrypoint: [/bin/sh, -c]
    command: sleep 3600
    depends_on: [mqtt]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [s3]
    command: server /data
    environment:
      MINIO_ROOT_USER: chaosadmin
      MINIO_ROOT_PASSWORD: chaos-password
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-client:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [s3]
    entrypoint: [/bin/sh, -c]
    command: sleep 3600
    depends_on:
      minio:
        condition: service_healthy
