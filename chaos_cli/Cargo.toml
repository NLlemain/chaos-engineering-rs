[package]
name = "chaos_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Distributed chaos and HFT fault replay CLI with recovery, policy, and SLO evidence"
keywords = ["chaos-engineering", "hft", "distributed-systems", "fault-injection", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "chaos"
path = "src/main.rs"

[dependencies]
chaos_core = { version = "0.4.0", path = "../chaos_core" }
chaos_control = { version = "0.4.0", path = "../chaos_control" }
chaos_hft = { version = "0.4.0", path = "../chaos_hft" }
chaos_pipeline = { version = "0.4.0", path = "../chaos_pipeline" }
chaos_scenarios = { version = "0.4.0", path = "../chaos_scenarios" }
chaos_metrics = { version = "0.4.0", path = "../chaos_metrics" }
chaos_web = { version = "0.4.0", path = "../chaos_web" }
chaos_packs = { version = "0.4.0", path = "../scenario-packs" }
tokio = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
axum = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }
tokio-util = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
