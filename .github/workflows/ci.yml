name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify generated capability matrix
        run: python scripts/generate_capability_matrix.py --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        run: cargo +stable test --locked --workspace --all-targets

  docker-integration:
    name: Live Docker disruption and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run live Docker integration test
        env:
          CHAOS_DOCKER_INTEGRATION: "1"
        run: cargo +stable test --locked -p chaos_core --test docker_integration -- --nocapture

  package:
    name: Verify crates.io packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Package independent crates
        run: |
          cargo +stable package --locked -p chaos_core
          cargo +stable package --locked -p chaos_hft
          cargo +stable package --locked -p chaos_packs
